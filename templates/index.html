<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Video, Image & Music AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Enlace corregido al manifiesto en la carpeta static -->
    <link rel="manifest" href="/static/manifest.json">
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 bg-clip-text text-transparent">Studio AI 🚀</h1>
            <a href="/create-checkout-session" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white px-4 py-2 rounded-xl text-xs font-bold tracking-wide transition shadow-lg">PRO ($1/mes)</a>
        </header>

        <!-- Selector de Modos (4 Pestañas) -->
        <div class="grid grid-cols-4 gap-1.5 mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
            <button type="button" onclick="switchMode('avatar')" id="btn-mode-avatar" class="py-2.5 rounded-xl font-bold text-[11px] bg-purple-600 text-white transition shadow">Avatar</button>
            <button type="button" onclick="switchMode('tiktok')" id="btn-mode-tiktok" class="py-2.5 rounded-xl font-bold text-[11px] text-slate-400 transition hover:text-white">TikTok</button>
            <button type="button" onclick="switchMode('instagram')" id="btn-mode-instagram" class="py-2.5 rounded-xl font-bold text-[11px] text-slate-400 transition hover:text-white">Instagram</button>
            <button type="button" onclick="switchMode('music')" id="btn-mode-music" class="py-2.5 rounded-xl font-bold text-[11px] text-slate-400 transition hover:text-white">Música 🎵</button>
        </div>

        <!-- FORMULARIO DE VIDEOS -->
        <form id="video-form" class="space-y-5">
            <input type="hidden" id="mode" name="mode" value="avatar">

            <!-- MODO AVATAR -->
            <div id="section-avatar" class="space-y-4">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Selecciona un Avatar:</label>
                <div class="grid grid-cols-3 gap-3">
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 p-3 rounded-2xl text-center hover:border-purple-500 transition">
                        <input type="radio" name="avatar" value="professional executive woman" checked class="hidden">
                        <span class="block text-xs font-semibold">Ejecutiva</span>
                    </label>
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 p-3 rounded-2xl text-center hover:border-purple-500 transition">
                        <input type="radio" name="avatar" value="tech developer man" class="hidden">
                        <span class="block text-xs font-semibold">Tecnología</span>
                    </label>
                    <label class="cursor-pointer border border-slate-800 bg-slate-950 p-3 rounded-2xl text-center hover:border-purple-500 transition">
                        <input type="radio" name="avatar" value="creative futuristic artist" class="hidden">
                        <span class="block text-xs font-semibold">Artista</span>
                    </label>
                </div>

                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Describe el video:</label>
                <textarea name="prompt" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:border-purple-500 transition" placeholder="Ej. mujer sonriendo mientras muestra su café..."></textarea>
            </div>

            <!-- MODO TIKTOK ADS -->
            <div id="section-tiktok" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Subir Foto del Producto:</label>
                    <input type="file" name="product_image" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Nombre del Producto:</label>
                    <input type="text" name="product_name" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-white focus:outline-none focus:border-pink-500 transition" placeholder="Ej. Termo K-pop Edition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Descripción / Beneficios:</label>
                    <input type="text" name="product_features" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-white focus:outline-none focus:border-pink-500 transition" placeholder="Ej. Mantiene bebidas frías 24h">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Tipo de Anuncio:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer border border-slate-800 bg-slate-950 p-3 rounded-2xl text-center hover:border-pink-500 transition">
                            <input type="radio" name="presentation_type" value="product_only" checked class="hidden">
                            <span class="block text-xs font-semibold">📦 Solo Producto</span>
                        </label>
                        <label class="cursor-pointer border border-slate-800 bg-slate-950 p-3 rounded-2xl text-center hover:border-pink-500 transition">
                            <input type="radio" name="presentation_type" value="with_person" class="hidden">
                            <span class="block text-xs font-semibold">🗣️ Con Persona</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Escena o Gancho Visual:</label>
                    <textarea name="prompt" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:border-pink-500 transition" placeholder="Ej. Tomas dinámicas con iluminación brillante..."></textarea>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-xl text-sm tracking-wide">✨ Generar Contenido con IA</button>
        </form>

        <!-- FORMULARIO DE INSTAGRAM (IMÁGENES) -->
        <form id="insta-form" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400 mb-1">Describe la Imagen Viral para Instagram:</label>
                <textarea name="insta_prompt" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="Ej. Un lujoso set de skincare dorado sobre una mesa de mármol blanco..."></textarea>
            </div>
            <button type="submit" id="submit-insta-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-xl text-sm tracking-wide">📸 Generar Imagen para Instagram</button>
        </form>

        <!-- FORMULARIO DE MÚSICA (MINIMAX MUSIC 2.6) -->
        <form id="music-form" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-amber-400 mb-1">Estilo Musical / Prompt (ej. Género, BPM, Instrumentos):</label>
                <input type="text" name="music_prompt" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-white focus:outline-none focus:border-amber-500 transition mb-3" placeholder="Ej. E minor, 90 BPM, acoustic guitar ballad, male vocal, emotional">

                <label class="block text-xs font-bold uppercase tracking-wider text-amber-400 mb-1">Letra de la Canción (Opcional):</label>
                <textarea name="lyrics" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:border-amber-500 transition font-mono text-xs" placeholder="[Verse]&#10;Tu piel radiante hoy...&#10;&#10;[Chorus]&#10;Brilla con nosotros..."></textarea>
            </div>
            <button type="submit" id="submit-music-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-xl text-sm tracking-wide">🎵 Generar Canción con Minimax</button>
        </form>

        <div id="loading" class="hidden text-center mt-6 text-pink-400 text-sm font-semibold animate-pulse">
            ⏳ Creando contenido con Inteligencia Artificial... Esto tomará un momento.
        </div>

        <!-- RESULTADOS -->
        <div id="result-container" class="hidden mt-6 text-center">
            <h3 id="result-title" class="text-sm font-bold text-emerald-400 mb-3">
